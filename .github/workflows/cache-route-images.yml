name: Cache route images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-route-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download licensed route images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/routes

          download() {
            outfile="$1"
            filename="$2"
            encoded="$(python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1]))' "$filename")"
            curl -L --fail --retry 3 \
              -A "FlattenCity/1.0 (https://github.com/DanielMax937/flatten-hangzhou)" \
              "https://commons.wikimedia.org/wiki/Special:Redirect/file/\${encoded}?width=1280" \
              -o "assets/routes/\${outfile}"
          }

          download "kuixing.jpg" "Kuixing Tower 1.jpg"
          download "jiefangbei.jpg" "Jiefangbei.jpg"
          download "hongyadong.jpg" "Hongyadong night lights Chongqing.jpg"
          download "raffles.jpg" "Raffles City Chongqing 20260507-1.jpg"
          download "liziba.jpg" "A train of Chongqing Rail Transit Line 2 coming through a residential building at Liziba.jpg"
          download "eling.jpg" "鹅岭公园 - Eling Park - 2016.03 - panoramio.jpg"
          download "shibati.jpg" "十八梯老街 - Old Street in Shibati Area - 2015.04 - panoramio.jpg"
          download "cableway.jpg" "Chongqing Changjiang Cableway.jpg"
          download "longmenhao.jpg" "重庆市南岸区南滨路建筑、趸船和长江.jpg"
          download "xiahaoli-area.jpg" "南滨路.jpg"

          file assets/routes/*.jpg
          ls -lh assets/routes

      - name: Commit cached images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/routes
          if git diff --cached --quiet; then
            echo "Route images are already cached."
            exit 0
          fi
          git commit -m "Cache attraction gallery images"
          git push
