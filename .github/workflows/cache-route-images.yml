name: Cache route images

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cache-route-images.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cache-images:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download licensed attraction images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/routes
          UA="FlattenCity/1.0 (https://github.com/DanielMax937/flatten-hangzhou)"

          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/d/d5/Kuixing_Tower_1.jpg/960px-Kuixing_Tower_1.jpg" -o assets/routes/kuixing.jpg
          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/4/41/Jiefangbei.jpg/1280px-Jiefangbei.jpg" -o assets/routes/jiefangbei.jpg
          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f1/Hongyadong_night_lights_Chongqing.jpg/960px-Hongyadong_night_lights_Chongqing.jpg" -o assets/routes/hongyadong.jpg
          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/01/Raffles_City_Chongqing_20260507-1.jpg/1280px-Raffles_City_Chongqing_20260507-1.jpg" -o assets/routes/raffles.jpg

          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e8/A_train_of_Chongqing_Rail_Transit_Line_2_coming_through_a_residential_building_at_Liziba.jpg/1280px-A_train_of_Chongqing_Rail_Transit_Line_2_coming_through_a_residential_building_at_Liziba.jpg" -o assets/routes/liziba.jpg
          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/%E9%B9%85%E5%B2%AD%E5%85%AC%E5%9B%AD_-_Eling_Park_-_2016.03_-_panoramio.jpg/1280px-%E9%B9%85%E5%B2%AD%E5%85%AC%E5%9B%AD_-_Eling_Park_-_2016.03_-_panoramio.jpg" -o assets/routes/eling.jpg

          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/e0/%E5%8D%81%E5%85%AB%E6%A2%AF%E8%80%81%E8%A1%97_-_Old_Street_in_Shibati_Area_-_2015.04_-_panoramio.jpg/1280px-%E5%8D%81%E5%85%AB%E6%A2%AF%E8%80%81%E8%A1%97_-_Old_Street_in_Shibati_Area_-_2015.04_-_panoramio.jpg" -o assets/routes/shibati.jpg
          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/e/ed/Chongqing_Changjiang_Cableway.jpg/1280px-Chongqing_Changjiang_Cableway.jpg" -o assets/routes/cableway.jpg
          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/0/07/%E9%87%8D%E5%BA%86%E5%B8%82%E5%8D%97%E5%B2%B8%E5%8C%BA%E5%8D%97%E6%BB%A8%E8%B7%AF%E5%BB%BA%E7%AD%91%E3%80%81%E8%B6%B8%E8%88%B9%E5%92%8C%E9%95%BF%E6%B1%9F.jpg/1280px-%E9%87%8D%E5%BA%86%E5%B8%82%E5%8D%97%E5%B2%B8%E5%8C%BA%E5%8D%97%E6%BB%A8%E8%B7%AF%E5%BB%BA%E7%AD%91%E3%80%81%E8%B6%B8%E8%88%B9%E5%92%8C%E9%95%BF%E6%B1%9F.jpg" -o assets/routes/longmenhao.jpg
          curl -L --fail --retry 3 -A "$UA" "https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a8/%E5%8D%97%E6%BB%A8%E8%B7%AF.jpg/960px-%E5%8D%97%E6%BB%A8%E8%B7%AF.jpg" -o assets/routes/xiahaoli-area.jpg

          file assets/routes/*.jpg
          ls -lh assets/routes

      - name: Commit cached images
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/routes
          if git diff --cached --quiet; then
            echo "Route images are already cached."
            exit 0
          fi
          git commit -m "Cache attraction gallery images"
          git push
